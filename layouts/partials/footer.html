<script>
	feather.replace()
	const isDark = window.matchMedia('(prefers-color-scheme: dark)')

	function initTheme(e) {
		let theme = getCookieValue("theme")

		if (theme == "dark") {
			document.body.setAttribute("class", "dark")
			document.getElementById("dark-scheme").media = "all"
		} else if (theme == "light") {
			document.getElementById("dark-scheme").media = "none"
		} else if (e.matches && "{{ .Site.Params.mode }}" == "auto") {
			document.body.setAttribute("class", "dark")
			document.getElementById("dark-scheme").media = "all"
		}
	}

	function getCookieValue(key) {
		const cookies = document.cookie.split("; ")
		for (let i = 0; i < cookies.length; i++) {
			const parts = cookies[i].split("=")
			if (parts[0] === key) {
				return parts[1]
			}
		}
		return ""
	}

	isDark.addEventListener("change", initTheme)
	initTheme(isDark)
</script>
